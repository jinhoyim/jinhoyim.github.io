baseURL = "https://jinhoyim.github.io/"
defaultContentLanguage = "ko"

enableRobotsTXT = true
summaryLength = 0

copyright = "&copy; 2025 Jinho Yim"

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  posts = "/posts/:year/:slug/"

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true
  [privacy.googleAnalytics]
    disable = true
    respectDoNotTrack = true

[services]
  [services.x]
    disableInlineCSS = true

[taxonomies]
  tag = "tags"
  category = "categories"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
